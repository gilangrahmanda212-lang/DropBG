name: Build Linux

on:
  push:
    tags:
      - 'v*' # Trigger build jika kamu push tag rilis (misal: v0.1.1)
  workflow_dispatch: # Bisa juga dijalankan manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Download AI Model
        run: |
          mkdir -p src-tauri/models
          # Ganti URL di bawah dengan link direct download model birefnet.onnx milikmu
          # (Kamu bisa taruh modelnya di GitHub Release, Google Drive direct link, dll)
          wget -O src-tauri/models/birefnet.onnx "https://github.com/ZhengPeng7/BiRefNet/releases/download/v1/BiRefNet-general-bb_swin_v1_tiny-epoch_232.onnx"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Frontend)
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # Akan membuat Release otomatis jika di-trigger lewat tag
          releaseName: 'DropBG ${{ github.ref_name }}'
          releaseBody: 'Release otomatis untuk Linux.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dropbg-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
