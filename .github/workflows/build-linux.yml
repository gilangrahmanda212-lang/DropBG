name: Build Linux

on:
  workflow_dispatch: # Hanya bisa dijalankan manual

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Download AI Model
        run: |
          mkdir -p src-tauri/models
          wget -O src-tauri/models/birefnet.onnx "https://github.com/ZhengPeng7/BiRefNet/releases/download/v1/BiRefNet-general-bb_swin_v1_tiny-epoch_232.onnx"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Frontend)
        run: npm install

      # PERUBAHAN ADA DI SINI: Langsung jalankan build manual
      - name: Build Tauri App (Manual)
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu

      # UPLOAD HASILNYA
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dropbg-linux
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
